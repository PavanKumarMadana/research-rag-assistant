# ============================================
# AI Research & Knowledge Assistant
# Docker Compose Configuration
# ============================================

version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-rag-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - DATABASE_URL=sqlite+aiosqlite:///./data/research_assistant.db
      - VECTOR_DB_PATH=./data/chromadb
      - LOG_LEVEL=INFO
    volumes:
      - app_data:/app/data
      - app_models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/analytics/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: research-rag-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    profiles:
      - production
    restart: unless-stopped

volumes:
  app_data:
    driver: local
  app_models:
    driver: local